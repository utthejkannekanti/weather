<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lunch Proposal 😍</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    background: linear-gradient(135deg, #ffecd2, #fcb69f);
    overflow: hidden;
}

.container {
    text-align: center;
    background: white;
    padding: 25px;
    border-radius: 20px;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position: relative;
}

/* Girl emoji */
.girl {
    font-size: 60px;
    animation: bounce 1s infinite;
}

@keyframes bounce {
    0%,100%{transform: translateY(0);}
    50%{transform: translateY(-10px);}
}

h1 {
    font-size: 18px;
    margin-top: 10px;
}

/* Buttons */
.buttons {
    position: relative;
    height: 120px;
    margin-top: 15px;
}

.btn {
    position: absolute;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
}

#yesBtn {
    background: #4CAF50;
    color: white;
    left: 40px;
    top: 50px;
}

#noBtn {
    background: #ff4d4d;
    color: white;
    left: 160px;
    top: 50px;
}

/* Floating hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: float 2s linear forwards;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-150px); opacity: 0; }
}

.result {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <div class="girl">👩‍🦰</div>

    <h1 id="text">😳 Hey… I'm hungry…<br>Will you take me for lunch? 🍛</h1>

    <div class="buttons">
        <button class="btn" id="yesBtn" onclick="yesClick()">😍 YES</button>
        <button class="btn" id="noBtn">🙅 NO</button>
    </div>

    <div class="result" id="result"></div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const text = document.getElementById("text");

// 🔊 voice
function speak(msg){
    let s = new SpeechSynthesisUtterance(msg);
    s.rate = 1;
    speechSynthesis.speak(s);
}

// 💖 hearts
function hearts(){
    for(let i=0;i<5;i++){
        let h = document.createElement("div");
        h.className="heart";
        h.innerHTML="💖";
        h.style.left=Math.random()*100+"%";
        h.style.top="60%";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),2000);
    }
}

// 😈 NO button escape + roast
function moveNo(){
    let x = Math.random()*200;
    let y = Math.random()*80;
    noBtn.style.left = x+"px";
    noBtn.style.top = y+"px";

    let funny = [
        "😡 Are you serious?",
        "😒 Think again...",
        "🙄 NO is not an option!",
        "😤 I will keep asking!",
        "😂 You can't escape!"
    ];

    text.innerHTML = funny[Math.floor(Math.random()*funny.length)];

    speak("Don't say no!");
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);

// 😍 YES click
function yesClick(){
    text.innerHTML = "🥰 Awww! Knew you would say YES!";
    document.getElementById("result").innerHTML =
        "🍛 Let's gooooo! I'm ordering extra food 😋";

    hearts();
    speak("Yay! Let's go for lunch!");
}

// initial voice
setTimeout(()=>{
    speak("Hey... will you take me for lunch?");
},1000);

</script>

</body>
</html>
